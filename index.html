
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>✨</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    padding: 20px;
    font-family: Arial, sans-serif;

    background: linear-gradient(
        -45deg,
        #090018,
        #271052,
        #003f5c,
        #4d0b36
    );

    background-size: 400% 400%;
    animation: nen 8s ease infinite;
}

.khung {
    position: relative;
    padding: 40px;
    max-width: 100%;
    border: 2px solid white;
    border-radius: 25px;
    background: rgba(255,255,255,0.08);
    text-align: center;
    backdrop-filter: blur(12px);

    box-shadow: 0 0 30px cyan;
    animation: bay 3s ease-in-out infinite;
}

h1 {
    margin: 0;
    color: white;
    font-size: clamp(28px, 5vw, 60px);
    font-weight: bold;
    overflow-wrap: anywhere;

    text-shadow:
        0 0 10px white,
        0 0 25px cyan,
        0 0 45px magenta;

    animation: sang 2s infinite alternate;
}

@keyframes nen {
    0% {
        background-position: 0% 50%;
    }
    50% {
        background-position: 100% 50%;
    }
    100% {
        background-position: 0% 50%;
    }
}

@keyframes bay {
    0%, 100% {
        transform: translateY(0) rotate(-1deg);
    }
    50% {
        transform: translateY(-12px) rotate(1deg);
    }
}

@keyframes sang {
    from {
        filter: hue-rotate(0deg);
    }
    to {
        filter: hue-rotate(90deg);
    }
}
</style>
</head>

<body>

<div class="khung">
    <h1>Con Quỳnh Bị Ngu , Con Ngọc cũng ngu</h1>
</div>

</body>
</html>
